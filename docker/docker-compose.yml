version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: crime_dashboard
      POSTGRES_USER: crime
      POSTGRES_PASSWORD: crimepass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    environment:
      - DATABASE_URL=postgresql+psycopg://crime:crimepass@postgres:5432/crime_dashboard
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
      - ALLOW_OPEN_POLICE_REGISTER=true
      - JWT_SECRET=dev-secret-key-change-in-production-min-32-chars
    volumes:
      - ../backend:/app

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000/ws/live
    depends_on:
      - backend

  openenv:
    build:
      context: ../openenv
      dockerfile: Dockerfile
    ports:
      - "7860:7860"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
    command: ["python", "app.py"]

volumes:
  postgres_data:
